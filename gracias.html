<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! - Prepa Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#FF6B00',
                            dark: '#E65A00',
                        },
                        background: {
                            dark: '#0A0F1C',
                            light: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;700;900&display=swap"

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl max-w-lg w-full text-center border border-slate-100">
        <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-5xl">check_circle</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-black mb-4 font-display text-slate-800">¡Registro Exitoso!</h1>
        <p class="text-slate-600 text-lg mb-8 leading-relaxed">
            Hemos recibido tus datos correctamente. Un asesor de Prepa Express se pondrá en contacto contigo en breve
            para darte todos los detalles.
        </p>
        <a href="/"
            class="inline-flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white font-bold text-lg px-8 py-4 rounded-xl shadow-lg shadow-primary/30 transition-transform hover:scale-105 w-full">
            <span class="material-symbols-outlined">home</span>
            Volver al inicio
        </a>
    </div>
</body>

</html>
